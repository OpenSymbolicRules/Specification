name: Validate specification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate JSON schemas and ecosystem manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator
        run: python -m pip install check-jsonschema==0.38.0

      - name: Validate schema meta-schemas
        run: check-jsonschema --check-metaschema schemas/*.schema.json

      - name: Validate ecosystem manifest
        run: check-jsonschema --schemafile schemas/ecosystem.schema.json ecosystem.json

      - name: Validate metadata profile example
        run: check-jsonschema --schemafile schemas/meta.schema.json --base-uri "file://${PWD}/schemas/" examples/meta-profiles.json

      - name: Validate inference example
        run: check-jsonschema --schemafile schemas/inference-file.schema.json --base-uri "file://${PWD}/schemas/" examples/propositional-resolution.inference.json

      - name: Validate inference test example
        run: check-jsonschema --schemafile schemas/inference-test-file.schema.json --base-uri "file://${PWD}/schemas/" examples/propositional-resolution.inference-test.json

      - name: Validate quantifier rule example
        run: check-jsonschema --schemafile schemas/rule-file.schema.json --base-uri "file://${PWD}/schemas/" examples/quantifier-negation.rule.json

      - name: Validate quantifier test example
        run: check-jsonschema --schemafile schemas/test-file.schema.json --base-uri "file://${PWD}/schemas/" examples/quantifier-negation.test.json

      - name: Validate OpenMath semantic closure
        run: python3 scripts/validate_semantic_closure.py examples

      - name: Test semantic-closure validator
        run: python3 scripts/test_validate_semantic_closure.py
